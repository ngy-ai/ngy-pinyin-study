[package]
name = "pinyin-study"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.8.0"
# 拼音数据（声母/韵母/拼读/标调），和 mobile 共用 shared/ 里的同一个 crate
pinyin-core = { path = "../shared" }
# 把 assets/audio 里的录音嵌进二进制
rust-embed = "8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_Multimedia",
    "Win32_Media_Speech",
    "Win32_System_Com",
] }

# Debug 构建下 GPUI 与组件库几乎没优化，跑起来会卡；
# 只把框架依赖按 opt-level 3 编译，自己的代码仍然保持 Debug。
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-pre-macros]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 3

[profile.dev.package.gpui-kit]
opt-level = 3

[profile.dev.package.gpui-kit-assets]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
