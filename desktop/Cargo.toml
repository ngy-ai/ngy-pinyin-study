[package]
name = "pinyin-study"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.8.0"
# 拼音数据（声母/韵母/拼读/标调），和 mobile 共用 shared/ 里的同一个 crate
pinyin-core = { path = "../shared" }
# 把 assets/audio 里的录音嵌进二进制
rust-embed = "8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_Multimedia",
    "Win32_Media_Speech",
    "Win32_System_Com",
] }

# GPUI 系的 opt-level 覆盖统一放在根 Cargo.toml 的 profile 段里。
